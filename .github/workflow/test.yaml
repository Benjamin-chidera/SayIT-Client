name: SayIT Test Workflow

on:
  push:
    branches:
      - better-auth

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3 
        with:
          node-version: '20'
      - run: npm ci 
      - run: npm test
      - run : npm run build
    