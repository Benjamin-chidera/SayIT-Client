name: Deploy

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # TODO: Configure your deployment here
      # Examples:
      # - Deploy to Vercel
      # - Deploy to Netlify
      # - Deploy to AWS
      # - Deploy to Azure
      # - Deploy to DigitalOcean
      # - Deploy via Docker

      - name: Notify deployment
        run: echo "Deployment configuration needed - update this workflow with your deployment provider"
